services:
  zombies:
    build: .
    image: zombies:latest
    container_name: zombies
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - zombies-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  zombies-data:
